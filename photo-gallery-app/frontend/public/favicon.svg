<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262821"/>
      <stop offset="100%" stop-color="#141612"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a18b"/>
      <stop offset="50%" stop-color="#c77a62"/>
      <stop offset="100%" stop-color="#9e4a34"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#3a3d32" stroke-width="2"/>

  <!-- Aperture Outer Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.9"/>
  <circle cx="32" cy="32" r="18" fill="#181a15" stroke="#44473c" stroke-width="1.2"/>

  <!-- Aperture Blades -->
  <path d="M32 14 L39 23 L28 26 Z" fill="url(#accentGrad)" opacity="0.85"/>
  <path d="M47 26 L42 36 L34 29 Z" fill="url(#accentGrad)" opacity="0.85"/>
  <path d="M41 45 L32 42 L35 32 Z" fill="url(#accentGrad)" opacity="0.85"/>
  <path d="M23 45 L22 35 L31 35 Z" fill="url(#accentGrad)" opacity="0.85"/>
  <path d="M15 32 L24 28 L23 38 Z" fill="url(#accentGrad)" opacity="0.85"/>
  <path d="M23 17 L31 23 L20 25 Z" fill="url(#accentGrad)" opacity="0.85"/>

  <!-- Inner Lens Glass -->
  <circle cx="32" cy="32" r="12" fill="#141612" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Stylized Monogram R -->
  <text x="32" y="38" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="20" font-weight="700" fill="#f3f1e9" text-anchor="middle" letter-spacing="-0.5">R</text>

  <!-- Sparkle Accent -->
  <circle cx="43" cy="21" r="2" fill="#fbbf24"/>
</svg>
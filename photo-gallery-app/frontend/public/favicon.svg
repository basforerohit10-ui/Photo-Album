<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft glow for outer ring and satellite dot -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark studio background disc -->
  <circle cx="32" cy="32" r="31" fill="#171914"/>

  <!-- Outer Copper/Terracotta Ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#c77a62" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Dark Inset Channel -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#111310" stroke-width="2.5"/>

  <!-- Middle Concentric Terracotta Lens Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#c77a62" stroke-width="1.5"/>

  <!-- Inner Dark Camera Core -->
  <circle cx="32" cy="32" r="18.5" fill="#252720" stroke="rgba(199, 122, 98, 0.65)" stroke-width="1.2"/>

  <!-- Fine Inner Aperture Ring -->
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="rgba(199, 122, 98, 0.35)" stroke-dasharray="2 2" stroke-width="0.8"/>

  <!-- Orbiting Terracotta Satellite Dot (At 2 o'clock) -->
  <circle cx="47" cy="17" r="3.5" fill="#d9947e" filter="url(#glow)"/>

  <!-- Signature RP Monogram (R in white, P in terracotta) -->
  <text x="32" y="38.5" font-family="'Cormorant Garamond', 'Georgia', 'Times New Roman', serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="-0.5px">
    <tspan fill="#f7f6f0">R</tspan><tspan fill="#d9947e" dx="-1.5">P</tspan>
  </text>
</svg>